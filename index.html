<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Detector de Objetos</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSI3NSIgZm9udC1zaXplPSI3MCI+8J+UjTwvdGV4dD48L3N2Zz4=">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: env(safe-area-inset-top) 16px 12px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 20;
  }
  h1 { margin: 12px 0 0; font-size: 17px; font-weight: 600; }
  #status {
    margin-top: 12px;
    font-size: 12px;
    color: #888;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(0,0,0,0.5);
  }
  #status.active { color: #4ade80; }
  #status.error { color: #ef4444; }
  #welcome {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    gap: 16px;
  }
  #welcome h2 { font-size: 22px; margin: 0; }
  #welcome p { color: #888; font-size: 14px; line-height: 1.5; margin: 0; max-width: 280px; }
  #startBtn {
    margin-top: 24px;
    padding: 16px 32px;
    background: #7c3aed;
    color: #fff;
    border: none;
    border-radius: 32px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(124,58,237,0.4);
  }
  #startBtn:active { transform: scale(0.97); }
  #viewer {
    position: relative;
    flex: 1;
    display: none;
    background: #000;
    overflow: hidden;
  }
  /* Video y canvas overlay ocupan el mismo espacio, alineados */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 100%;
    max-height: 100%;
  }
  #video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #capture { display: none; }
  #controls {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  #controls button {
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    color: #fff;
  }
  #controls button.stop { background: rgba(220,38,38,0.85); }
  #controls button:active { transform: scale(0.95); }
  #stats {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 60px);
    left: 12px;
    background: rgba(0,0,0,0.6);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    z-index: 15;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <header>
    <h1>🔍 Detector en vivo</h1>
    <span id="status">Listo</span>
  </header>

  <div id="welcome">
    <h2>Detección en tiempo real</h2>
    <p>Video fluido + bounding boxes superpuestos. Apunta a personas, animales, objetos cotidianos.</p>
    <button id="startBtn">📷 Iniciar cámara</button>
  </div>

  <div id="viewer">
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <canvas id="capture"></canvas>
    <div id="stats">— ms</div>
    <div id="controls">
      <button id="flipBtn">🔄 Cambiar</button>
      <button id="toggleBtn">⏸ Pausar</button>
      <button id="stopBtn" class="stop">⏹ Detener</button>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const video = $('video');
const overlay = $('overlay');
const capture = $('capture');
const stage = $('stage');
const octx = overlay.getContext('2d');
const cctx = capture.getContext('2d');

let stream = null, running = false, paused = false;
let lastSent = 0, inflight = false;
let latestPredictions = [], srcDims = { w: 0, h: 0 };
let networkMs = 0;
let currentFacing = 'environment'; // 'environment' = trasera, 'user' = frontal

const INFERENCE_INTERVAL = 250; // ms entre frames enviados (~4 fps de inferencia)
const CAPTURE_WIDTH = 320;      // resize antes de enviar — más rápido

// Paleta de colores estable por clase
const COLORS = ['#ef4444','#f59e0b','#10b981','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#84cc16','#f97316','#14b8a6'];
const colorFor = (cls) => {
  let h = 0;
  for (const c of cls) h = (h * 31 + c.charCodeAt(0)) | 0;
  return COLORS[Math.abs(h) % COLORS.length];
};

const setStatus = (msg, type = '') => {
  $('status').textContent = msg;
  $('status').className = type;
};

function fitStage() {
  // Ajustar tamaño del stage (video + overlay) al viewport manteniendo aspect ratio
  if (!video.videoWidth) return;
  const vr = video.videoWidth / video.videoHeight;
  const wr = window.innerWidth / window.innerHeight;
  if (wr > vr) {
    stage.style.height = '100%';
    stage.style.width = (window.innerHeight * vr) + 'px';
  } else {
    stage.style.width = '100%';
    stage.style.height = (window.innerWidth / vr) + 'px';
  }
  // Canvas overlay siempre con resolución nativa del video
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
}

async function start() {
  try {
    setStatus('Pidiendo cámara…');
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacing, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);

    $('welcome').style.display = 'none';
    $('viewer').style.display = 'block';
    fitStage();
    window.addEventListener('resize', fitStage);

    running = true;
    setStatus('● En vivo', 'active');

    // Bucle de inferencia (asíncrono, no bloquea el video)
    inferenceLoop();
    // Bucle de render (60fps fluidos)
    renderLoop();
  } catch (e) {
    setStatus('❌ ' + e.message, 'error');
    alert('Error de cámara: ' + e.message);
  }
}

async function inferenceLoop() {
  while (running) {
    if (paused || inflight || !video.videoWidth) {
      await new Promise(r => setTimeout(r, 50));
      continue;
    }
    const wait = INFERENCE_INTERVAL - (Date.now() - lastSent);
    if (wait > 0) { await new Promise(r => setTimeout(r, wait)); continue; }

    lastSent = Date.now();
    inflight = true;
    const t0 = performance.now();

    // Capturar frame y resize a CAPTURE_WIDTH (mantiene aspect)
    const scale = CAPTURE_WIDTH / video.videoWidth;
    capture.width = CAPTURE_WIDTH;
    capture.height = Math.round(video.videoHeight * scale);
    cctx.drawImage(video, 0, 0, capture.width, capture.height);
    const b64 = capture.toDataURL('image/jpeg', 0.6).split(',')[1];

    try {
      const r = await fetch('/api/infer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: b64 })
      });
      const data = await r.json();
      networkMs = Math.round(performance.now() - t0);

      if (data.predictions) {
        latestPredictions = data.predictions;
        srcDims = { w: data.image.width, h: data.image.height };
        const infMs = Math.round((data.time || 0) * 1000);
        $('stats').innerHTML = `${data.predictions.length} obj · ${networkMs}ms total · ${infMs}ms inferencia`;
        setStatus('● En vivo', 'active');
      } else if (data.error || data.message) {
        setStatus('❌ ' + (data.error || data.message), 'error');
      }
    } catch (e) {
      setStatus('❌ ' + e.message, 'error');
    } finally {
      inflight = false;
    }
  }
}

function renderLoop() {
  if (!running) return;
  // Limpiar overlay
  octx.clearRect(0, 0, overlay.width, overlay.height);

  if (latestPredictions.length && srcDims.w) {
    // Escalar coordenadas del modelo (espacio CAPTURE_WIDTH) al espacio del video nativo
    const sx = overlay.width / srcDims.w;
    const sy = overlay.height / srcDims.h;

    for (const p of latestPredictions) {
      const w = p.width * sx;
      const h = p.height * sy;
      const x = (p.x * sx) - w / 2;
      const y = (p.y * sy) - h / 2;
      const color = colorFor(p.class);

      // Box
      octx.lineWidth = 3;
      octx.strokeStyle = color;
      octx.strokeRect(x, y, w, h);

      // Label background
      const label = `${p.class} ${Math.round(p.confidence * 100)}%`;
      octx.font = 'bold 16px -apple-system, sans-serif';
      const tw = octx.measureText(label).width + 12;
      octx.fillStyle = color;
      octx.fillRect(x, y - 24, tw, 24);

      // Label text
      octx.fillStyle = '#fff';
      octx.fillText(label, x + 6, y - 7);
    }
  }
  requestAnimationFrame(renderLoop);
}

async function switchCamera() {
  if (!running) return;
  currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  setStatus('Cambiando cámara…');
  try {
    // Soltar stream actual
    stream?.getTracks().forEach(t => t.stop());
    // Pedir nuevo stream con la cámara opuesta
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacing, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    fitStage();
    // Limpiar predicciones viejas (eran de la otra cámara)
    latestPredictions = [];
    setStatus('● En vivo', 'active');
  } catch (e) {
    setStatus('❌ Cámara no disponible', 'error');
    // Revertir si falló
    currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  }
}

$('startBtn').onclick = start;
$('flipBtn').onclick = switchCamera;
$('toggleBtn').onclick = () => {
  paused = !paused;
  $('toggleBtn').textContent = paused ? '▶ Reanudar' : '⏸ Pausar';
  setStatus(paused ? '⏸ Pausado' : '● En vivo', paused ? '' : 'active');
};
$('stopBtn').onclick = () => {
  running = false;
  stream?.getTracks().forEach(t => t.stop());
  $('viewer').style.display = 'none';
  $('welcome').style.display = 'flex';
  latestPredictions = [];
  setStatus('Listo');
};
</script>
</body>
</html>
